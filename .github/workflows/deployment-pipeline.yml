# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: [ "main" ]

# Add permissions
permissions:
  contents: read
  pages: write
  id-token: write

env:
  VITE_OPEN_WEATHER_KEY: ${{ secrets.OPEN_WEATHER_KEY }}
  VITE_GEOAPIFY_KEY: ${{ secrets.GEOAPIFY_KEY }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A failing test fails this job, so the build and deploy never run.
      # Coverage is reported only; no percentage can fail the job.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage.txt ]; then
            {
              echo '### Test coverage'
              echo '```'
              cat coverage/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
