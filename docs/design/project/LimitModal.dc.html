<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Favorites limit modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#f5f7fa;color:#1e2935;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
a{color:#3d6c9e}a:hover{color:#2d5480}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #3d6c9e;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="position: relative; min-height: 760px; background: #f5f7fa; overflow: hidden">

  <div aria-hidden="true">
    <header style="background: #ffffff; border-bottom: 1px solid #dfe4ea">
      <div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px; box-sizing: border-box">
        <svg width="32" height="32" viewBox="0 0 32 32"><circle cx="13" cy="13" r="7" fill="#cdbf86"></circle><path d="M10 26h14a5 5 0 0 0 0-10 7 7 0 0 0-13.4 2.2A4 4 0 0 0 10 26z" fill="#ffffff" stroke="#3d6c9e" stroke-width="2"></path></svg>
        <span style="font-size: 18px; font-weight: 600">Weather</span>
      </div>
    </header>
    <div style="max-width: 1200px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box">
      <div style="height: 44px; border-bottom: 1px solid #dfe4ea"></div>
      <div style="height: 520px; background: #ffffff; border: 1px solid #dfe4ea; border-radius: 12px"></div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(30,41,53,0.45); display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
    <div role="dialog" aria-modal="true" aria-labelledby="limit-title" style="width: 100%; max-width: 440px; background: #ffffff; border-radius: 14px; box-shadow: 0 12px 40px rgba(30,41,53,0.25); padding: 24px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #e7eef6; display: grid; place-items: center; color: #3d6c9e">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5l-1.3-1.2C5.6 14.7 2.5 11.9 2.5 8.4 2.5 5.6 4.7 3.5 7.4 3.5c1.6 0 3.1.7 4.1 1.9 1-1.2 2.5-1.9 4.1-1.9 2.7 0 4.9 2.1 4.9 4.9 0 3.5-3.1 6.3-8.2 10.9L12 20.5z"></path></svg>
      </div>
      <h2 id="limit-title" style="margin: 0; font-size: 20px; line-height: 1.3">Favorites are full</h2>
      <p style="margin: 0; color: #5b6878">You can keep up to 5 favorite cities. To add Odesa, remove one of your favorites first.</p>
      <div style="display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap">
        <button style="height: 40px; padding: 0 16px; background: #ffffff; border: 1px solid #dfe4ea; border-radius: 8px">Open Favorites</button>
        <button style="height: 40px; padding: 0 20px; background: #3d6c9e; color: #ffffff; border: 0; border-radius: 8px; font-weight: 600">OK</button>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
